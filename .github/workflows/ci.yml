name: CI Quality Gate

on:
  push:
    branches-ignore:
      - 'main'
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Lint, Test & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Code Style (ESLint)
        run: npm run lint

      - name: Run Unit & Integration Tests (Vitest)
        run: npm run test

      - name: Verify Production Compilation (TypeScript & Vite)
        run: npm run build
