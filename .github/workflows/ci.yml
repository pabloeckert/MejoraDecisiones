name: CI - Quality & Build Verification

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting & linting
        run: npm run lint

      - name: Run test suite (Vitest)
        run: npm run test

      - name: Compile & bundle production build
        run: npm run build
